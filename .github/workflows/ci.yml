name: CI

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "docs/**"
      - "**.md"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: objex
          POSTGRES_PASSWORD: objex
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U objex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/*/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore ObjeX.slnx

      - name: Build
        run: dotnet build ObjeX.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ObjeX.slnx --no-build --configuration Release --verbosity normal
        env:
          OBJEX_TEST_POSTGRES: ${{ matrix.database == 'postgresql' && 'Host=localhost;Port=5432;Username=objex;Password=objex' || '' }}
