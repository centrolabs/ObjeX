name: CD

on:
  push:
    tags:
      - "v*"

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: src/*/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore ObjeX.slnx

      - name: Build
        run: dotnet build ObjeX.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test ObjeX.slnx --no-build --configuration Release --verbosity normal

  publish:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/centrolabs/objex:latest
            ghcr.io/centrolabs/objex:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          sbom: true
          provenance: mode=max

      - name: Attest image
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/centrolabs/objex
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Publish Helm chart
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm package deploy/helm/objex --version "${{ steps.version.outputs.version }}" --app-version "${{ github.ref_name }}"
          helm push "objex-${{ steps.version.outputs.version }}.tgz" oci://ghcr.io/centrolabs/charts

  scan:
    name: SBOM & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ghcr.io/centrolabs/objex:${{ github.ref_name }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: objex-${{ github.ref_name }}.spdx.json
          artifact-name: objex-${{ github.ref_name }}.spdx.json
          upload-release-assets: false

      - name: Scan SBOM
        id: grype
        uses: anchore/scan-action@v7
        with:
          sbom: objex-${{ github.ref_name }}.spdx.json
          fail-build: false
          output-format: sarif

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: scan
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download SBOM
        uses: actions/download-artifact@v8
        with:
          name: objex-${{ github.ref_name }}.spdx.json

      # Hand-written notes for this tag, if any, go above the generated ones.
      - name: Release notes
        id: notes
        run: |
          file=".github/release-notes/${GITHUB_REF_NAME}.md"
          [ -f "$file" ] || { file="$RUNNER_TEMP/release-notes.md"; : > "$file"; }
          echo "path=$file" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: objex-${{ github.ref_name }}.spdx.json
