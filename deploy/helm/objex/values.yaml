image:
  repository: ghcr.io/centrolabs/objex
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# 1654 is the app user of the image. fsGroup gives it the volume.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1654
  runAsGroup: 1654
  fsGroup: 1654
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

# The root filesystem is read-only; /data and /tmp are volumes.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

service:
  type: ClusterIP
  uiPort: 9001
  s3Port: 9000

ingress:
  enabled: false
  className: ""
  # S3 API ingress (public)
  s3:
    host: s3.example.com
    annotations: {}
    tls: []
  # UI ingress (internal, optional)
  ui:
    host: objex.example.com
    annotations: {}
    tls: []

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# WARNING: Change the default admin password before deploying to production!
admin:
  password: admin

seed:
  buckets: ""
  s3Credential:
    name: ""
    accessKeyId: ""
    secretAccessKey: ""

metrics:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi
